   <g id="text_17">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="9.195728" y="258.728" transform="rotate(-0 9.195728 258.728)">FRQI patch state:   |ψ⟩ = N^(−1/2) Σi (cos θi |0⟩ + sin θi |1⟩) |i⟩,   θi = (π/2)·b·xi          (2·log2 p + 1 qubits)</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="9.195728" y="278.132" transform="rotate(-0 9.195728 278.132)">NEQR patch state:  |ψ⟩ = N^(−1/2) Σi |ci⟩ |i⟩,   ci = round(xi (2^q − 1))                                    (2·log2 p + q qubits)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="9.195728" y="297.536" transform="rotate(-0 9.195728 297.536)">Kernel:  K(A,B) = Tr(ρA ρB) = mean over patch pairs k,l of |⟨ψk^A | ψl^B⟩|²   — translation-robust because ρ averages over positions.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6470" x="9.195728" y="314.784" transform="rotate(-0 9.195728 314.784)">Classical control: identical patches, per-patch moments + RBF-SVM.</text>
   </g>
  </g>
 </g>
